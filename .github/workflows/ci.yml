name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-checks:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --all-groups --all-extras
      - name: Run quality checks
        run: uv run prek run --all-files
      - name: Verify committed CLI artifact
        run: uv run yaml2genie check tests/inputs/minimal.yaml --artifact tests/artifacts/minimal.json

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --all-groups --all-extras
      - name: Run unit tests
        run: uv run pytest -v tests --cov=src --cov-report=term-missing

- id: "00000000000000000000000000000011"
  question: Show sales for a region.
  sql: SELECT SUM(order_amount) FROM sales.analytics.orders WHERE region = :region
  parameters:
    - name: region
      type_hint: STRING
      description: Region to filter.
      default_value: {values: [EMEA]}
  usage_guidance: Use for geographic sales questions.
